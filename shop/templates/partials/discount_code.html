<div class="discount_code_box" style="direction:rtl; display: none; position: fixed; backdrop-filter: blur(25px); background: rgba(255, 255, 255, 0.5); left: 0; top: 0; width: 100%; height: 100%; z-index: 9999;">
    <div style="position: relative; margin: auto; top: 10%; width: 25%; padding: 20px; background: white; border: darkblue solid 5px; border-radius: 15px;">
        <span class="close_button" style="cursor: pointer; float: left; font-size: 24px;">&times;</span>
        <form method="post" action="{% url 'shop:add_discount_code' %}">
            {% csrf_token %}
            <label for="discount_code">کد تخفیف</label>
            <input maxlength="10" name="discount_code" type="text">
            <input type="submit" value="اعمال">
        </form>
    </div>
</div>
