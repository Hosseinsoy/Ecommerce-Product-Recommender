<div class="create_address_box" style="direction:rtl; display: none; position: fixed; backdrop-filter: blur(25px); background: rgba(255, 255, 255, 0.5); left: 0; top: 0; width: 100%; height: 100%; z-index: 9999;">
    <div style="position: relative; margin: auto; top: 10%; width: 50%; padding: 20px; background: white; border: darkblue solid 5px; border-radius: 15px;">
        <span class="close_button" style="cursor: pointer; float: left; font-size: 24px;">&times;</span>
        <form method="post" action="{% url 'account:create_address' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" value="ذخیره آدرس">
        </form>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="text/javascript">
        $(document).ready(function() {
    $('#id_province').change(function() {
        var provinceId = $(this).val();
            $.ajax({
                url: '{% url 'account:load_cities' %}',
                data: {
                    'province_id': provinceId
                },
                success: function(data) {
                    $("#id_city").html('');
                    $.each(data, function(index, city) {
                        $("#id_city").append('<option value="' + city.id + '">' + city.name + '</option>');
                    });
                },
            });
    });
});

    </script>
