<div
    class="edit_address_box"
    style="
        display: none;
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 99999 !important;
        direction: rtl;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        overflow-y: auto;
        padding: 30px 15px;
        box-sizing: border-box;
    "
>

    <div
        style="
            position: relative;
            width: min(650px, 100%);
            margin: 5vh auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
            box-sizing: border-box;
        "
    >

        <!-- CLOSE -->

        <span
            class="close_edit_address"
            style="
                position: absolute;
                top: 16px;
                left: 18px;
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                border-radius: 10px;
                background: #f3f4f6;
                color: #555;
                font-size: 24px;
                line-height: 1;
                transition: 0.2s;
            "
            title="بستن"
        >
            &times;
        </span>


        <!-- HEADER -->

        <div
            style="
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 25px;
                padding-bottom: 18px;
                border-bottom: 1px solid #eeeeee;
            "
        >

            <div
                style="
                    width: 48px;
                    height: 48px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-shrink: 0;
                    border-radius: 14px;
                    background: #f3f1ff;
                    color: #07006f;
                    font-size: 20px;
                "
            >
                <i class="fa fa-location-dot"></i>
            </div>


            <div>

                <h5
                    style="
                        margin: 0 0 5px 0;
                        font-weight: 700;
                        color: #222;
                    "
                >
                    ویرایش آدرس
                </h5>

                <small
                    style="
                        color: #888;
                    "
                >
                    اطلاعات آدرس خود را ویرایش کنید
                </small>

            </div>

        </div>


        <!-- FORM -->

        <form
            method="post"
            action="{% url 'account:edit_address' address.id %}"
        >

            {% csrf_token %}


            <div class="edit-address-form">

                {{ form.as_p }}

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="btn custom-btn-danger"
                style="
                    width: 100%;
                    margin-top: 15px;
                    padding: 12px 20px;
                    border-radius: 14px;
                    font-weight: 600;
                    font-size: 15px;
                "
            >
                <i class="fa fa-check me-1"></i>
                ذخیره تغییرات
            </button>

        </form>

    </div>

</div>


<style>

    .edit_address_box input,
    .edit_address_box select,
    .edit_address_box textarea {

        width: 100%;
        padding: 11px 13px;
        border: 1px solid #dfe1e5;
        border-radius: 12px;
        background: #fff;
        color: #333;
        font-size: 14px;
        outline: none;
        transition: 0.2s;

    }


    .edit_address_box input:focus,
    .edit_address_box select:focus,
    .edit_address_box textarea:focus {

        border-color: #07006f;
        box-shadow: 0 0 0 3px rgba(7, 0, 111, 0.08);

    }


    .edit_address_box textarea {

        min-height: 100px;
        resize: vertical;

    }


    .edit_address_box p {

        margin-bottom: 16px;

    }


    .edit_address_box label {

        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #444;

    }


    .edit_address_box .helptext {

        display: block;
        margin-top: 5px;
        color: #888;
        font-size: 12px;

    }


    .edit_address_box ul.errorlist {

        margin: 5px 0;
        padding: 0;
        list-style: none;
        color: #dc3545;
        font-size: 13px;

    }


    .close_edit_address:hover {

        background: #ffecec !important;
        color: #dc3545 !important;

    }


    @media (max-width: 768px) {

        .edit_address_box {

            padding: 15px !important;

        }


        .edit_address_box > div {

            width: 100% !important;
            margin: 2vh auto !important;
            padding: 22px !important;
            border-radius: 20px !important;

        }

    }

</style>

<script>

$(document).ready(function(){


    $('#id_province').change(function(){

        let provinceId = $(this).val();


        $.ajax({

            url:"{% url 'account:load_cities' %}",

            data:{
                province_id:provinceId
            },


            success:function(data){

                $("#id_city").html("");

                $.each(data,function(index,city){

                    $("#id_city").append(
                        `<option value="${city.id}">
                            ${city.name}
                        </option>`
                    );

                });


            }

        });


    });


});

</script>
